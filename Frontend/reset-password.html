<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Sales Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="forgotPasswordContainer">

        <!-- Step 1: Enter Username -->
        <div id="usernameStep">

            <div id="headingDiv">
                <h1 id="heading">Forgot Password?</h1>
                <p>Enter your username to recover your account.</p>
            </div>

            <div id="inputDiv">

                <div id="usernameDiv">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter Username">
                </div>

            </div>

            <div id="buttonDiv">
                <button id="sendCode">Send Code</button>
            </div>

        </div>


        <!-- Step 2: Enter Verification Code -->
        <div id="codeStep">

            <div id="headingDiv">
                <h1 id="heading">Verify Your Email</h1>
                <p>Enter the 6-digit code sent to your email.</p>
            </div>

            <div id="inputDiv">

                <div id="codeDiv">
                    <label for="verificationCode">Verification Code</label>
                    <input type="text" id="verificationCode" placeholder="Enter 6-digit code" maxlength="6">
                </div>

            </div>

            <div id="buttonDiv">
                <button id="verifyCode">Next</button>
            </div>

        </div>


        <!-- Step 3: Set New Password -->
        <div id="passwordStep">

            <div id="headingDiv">
                <h1 id="heading">Set New Password</h1>
                <p>Enter your new password below.</p>
            </div>

            <div id="inputDiv">

                <div id="newPasswordDiv">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter New Password">
                </div>

                <div id="confirmPasswordDiv">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm New Password">
                </div>

            </div>

            <div id="buttonDiv">
                <button id="resetPassword">Reset Password</button>
            </div>

        </div>
        <div id="success">

            <div id="headingDiv">
                <h1 id="heading">Password Changed Successfully!</h1>
            </div>
            <div id="buttonDiv">
                <button id="backLogIn">Back to Log In</button>
            </div>

        </div>

    </div>
    <div id="user-error-modal" class="user-error-modal">
        <div class="user-error-box">
            <h2>Error</h2>

            <p id="user-error-message"></p>

            <button id="close-user-error" class="close-user-error-button">
                Close
            </button>
        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
