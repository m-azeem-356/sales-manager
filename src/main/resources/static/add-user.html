<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New User - Sales Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="backButton">Back</button>

    <div id="addUserContainer">

        <!-- Step 1 -->
        <div id="userDetailsStep">

            <div id="headingDiv">
                <h1 id="heading">Add New User</h1>
                <p>Create a new user account.</p>
            </div>

            <div id="inputDiv">

                <div class="userInputDiv">
                    <label for="newUsername">Username</label>
                    <input type="text" id="newUsername" placeholder="Enter Username">
                </div>

                <div class="userInputDiv">
                    <label for="newPassword">Password</label>
                    <input type="password" id="newPassword" placeholder="Enter Password">
                </div>

                <div class="userInputDiv">
                    <label for="confirmNewPassword">Confirm Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Confirm Password">
                </div>
                <div id="adminOption">
                    <input type="checkbox" id="adminChecked">
                    <label for="adminChecked">Make this user an admin</label>
                </div>

            </div>

            <div id="buttonDiv">
                <button id="nextUserDetails">Next</button>
            </div>

        </div>


        <!-- Step 2 -->
        <div id="userEmailStep">

            <div id="headingDiv">
                <h1 id="heading">Enter Email</h1>
                <p>Enter the email for this account.</p>
            </div>

            <div id="inputDiv">

                <div class="userInputDiv">
                    <label for="userEmail">Email</label>

                    <input type="email" id="userEmail" placeholder="Enter Email">

                    <p id="emailMessage">
                        This email will be used to verify the account.
                    </p>
                </div>

            </div>

            <div id="buttonDiv">
                <button id="sendUserCode">Next</button>
            </div>

        </div>


        <!-- Step 3 -->
        <div id="userCodeStep">

            <div id="headingDiv">
                <h1 id="heading">Verify Email</h1>
                <p>Enter the 6-digit code sent to the email.</p>
            </div>

            <div id="inputDiv">

                <div class="userInputDiv">
                    <label for="userVerificationCode">
                        Verification Code
                    </label>

                    <input type="text" id="userVerificationCode" placeholder="Enter 6-digit code" maxlength="6">
                </div>

            </div>

            <div id="buttonDiv">
                <button id="confirmUser">Create User</button>
            </div>

        </div>

        <div id="success">

            <div id="headingDiv">
                <h1 id="heading">User Added Successfully!</h1>
            </div>
            <div id="buttonDiv">
                <button id="backLogIn">Back to Log In</button>
            </div>

        </div>
    </div>
    <div id="user-error-modal" class="user-error-modal">
        <div class="user-error-box">
            <h2>Error</h2>

            <p id="user-error-message"></p>

            <button id="close-user-error" class="close-user-error-button">
                Close
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
